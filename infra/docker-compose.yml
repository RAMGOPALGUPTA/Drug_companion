services:
  postgres:
    image: postgres:16-alpine
    container_name: drug-companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drug_companion
      POSTGRES_USER: drug_companion
      POSTGRES_PASSWORD: drug_companion_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drug_companion -d drug_companion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: drug-companion-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://drug_companion:drug_companion_dev@postgres:5432/drug_companion
      APP_ENV: development
      PIPELINE_VERSION: 1.0.0
      APP_VERSION: 0.3.0
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
