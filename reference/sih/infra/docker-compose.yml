services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sih
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://sih:sih_dev@postgres:5432/sih
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [postgres]
  dashboard:
    image: node:22-alpine
    working_dir: /app
    volumes: ["../dashboard:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
